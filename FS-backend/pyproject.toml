[project]
name = "fs-backend"
version = "0.1.0"
description = "Meeting Transcript API Gateway"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "alembic>=1.13.0",
    "pgvector>=0.2.0",
    "psycopg[binary]>=3.2.0",
    "bcrypt>=5.0.0",
    "pyjwt>=2.15.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
