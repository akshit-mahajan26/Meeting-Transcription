[project]
name = "fs-frontend"
version = "0.1.0"
description = "Meeting Transcript Streamlit Frontend"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.38.0",
    "httpx>=0.27.0",
    "pandas>=2.2.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
