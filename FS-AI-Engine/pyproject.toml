[project]
name = "fs-ai-engine"
version = "0.1.0"
description = "Meeting Transcript AI Engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "openai>=1.0.0",
    "tiktoken>=0.7.0",
    "pgvector>=0.2.0",
    "asyncpg>=0.29.0",
    "sqlalchemy>=2.0.0",
    "greenlet>=3.5.6",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
