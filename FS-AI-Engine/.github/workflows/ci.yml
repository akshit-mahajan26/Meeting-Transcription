name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Database-backed tests need the schema from the Backend repo's migrations and skip without TEST_DATABASE_URL
      DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
      ENGINE_API_KEY: ci-engine-key-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --frozen
      - name: Tests
        run: uv run pytest -q
